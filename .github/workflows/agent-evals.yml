# Re-runs the tc-automator eval whenever the agent, its evals or the test helpers change,
# and blocks the PR if quality drops below the committed baseline.
name: agent-evals

on:
  pull_request:
    paths:
      - ".github/agents/**"
      - "evals/**"
      - "manual-tcs/**"
      - "tests/support/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate (e.g. a newly released one)"
        required: false

env:
  WAZA_VERSION: v0.39.0

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Install waza
        run: |
          curl -fsSL -o /usr/local/bin/waza \
            "https://github.com/microsoft/waza/releases/download/${WAZA_VERSION}/waza-linux-amd64"
          chmod +x /usr/local/bin/waza
          waza --version

      - name: Run eval
        working-directory: evals/tc-automator
        env:
          # Fine-grained PAT of a Copilot-licensed user with the "Copilot Requests" permission
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          model_flag=""
          if [ -n "${{ inputs.model }}" ]; then model_flag="--model ${{ inputs.model }}"; fi
          waza run eval.yaml $model_flag -o results.json --reporter junit:results.xml || true

      # 20pp = one of five tasks: tolerates single-trial noise, any golden task (tc-005) failing still exits 2
      - name: Gate against baseline
        working-directory: evals/tc-automator
        run: |
          waza gate --baseline ../baseline/tc-automator.json --current results.json \
            --max-regression-pct 20 --format github-actions

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waza-results
          path: evals/tc-automator/results.*
