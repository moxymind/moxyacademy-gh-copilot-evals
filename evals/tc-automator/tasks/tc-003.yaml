id: tc-003
name: Sort products by price, low to high
tags: [inventory]
inputs:
  prompt: "Automate the manual test case in manual-tcs/TC-003.md"
  context:
    fixture: fixtures/project
  files:
    - path: manual-tcs/TC-003.md

graders:
  # Layer 1: the test actually runs green against the app
  - type: program
    name: test_passes
    config:
      command: bash
      args: ["graders/run-generated-test.sh", "TC-003"]
      timeout: 120

  # Layer 2: team conventions, checked deterministically
  - type: file
    name: conventions
    config:
      must_exist: [tests/generated/TC-003.spec.ts]
      content_patterns:
        - path: tests/generated/TC-003.spec.ts
          must_match:
            - 'data-test'
            - 'test\(\s*["''`]should '
            - 'import\s*\{[^}]*\bloginAs\b[^}]*\}\s*from\s*["'']\.\./support/auth["'']'
          must_not_match:
            - 'waitForTimeout'
            - 'locator\(\s*["''`][#.][A-Za-z]'
            - '(?i)xpath'
            - 'https?://(www\.)?saucedemo\.com'
            - 'secret_sauce'

  # Layer 3: TC fidelity, judged by an LLM against the manual TC
  - type: prompt
    name: tc_fidelity
    config:
      rubric: graders/tc-fidelity.md
      continue_session: true
